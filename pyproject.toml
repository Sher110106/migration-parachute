[project]
name = "migration-parachute"
version = "0.1.0"
description = "An agent that runs expand/backfill/contract Postgres migrations, recovers from lock failures, and refuses to contract without proof."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "neatlogs>=0.1",
    "anthropic>=1.0",
]

[project.scripts]
parachute = "parachute.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parachute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
